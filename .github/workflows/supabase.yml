# Optional: redeploys the LahLahLearn backend to Supabase from GitHub.
# The live project is already deployed and the weekly report runs inside Supabase (pg_cron), so this
# workflow only runs when started by hand (Actions > Backend > Run workflow).
#
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    vuhvvzmmnndrgxoywfem
#   SUPABASE_DB_PASSWORD    Project Settings > Database > Reset database password
# Server settings (Stripe keys, cron secret, site URL, admin emails) live in Supabase Vault as app.<NAME>;
# function secrets with the same names override them. RESEND_API_KEY, EMAIL_FROM and ANTHROPIC_API_KEY
# can be added either way.
name: Backend

on:
  workflow_dispatch:

concurrency: { group: backend-${{ github.event_name }}, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Link project
        run: supabase link --project-ref "$REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Database changes
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Functions
        run: supabase functions deploy --project-ref "$REF" --use-api
