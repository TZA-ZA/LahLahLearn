<!doctype html>
<html lang="en">
<head>

<title>LahLahLearn · Island Journey</title>
<!--
  LahLahLearn 3D World: "Island Journey" (one self-contained file, three.js r128 from a CDN)
  - 8 islands, 40 journey stops (learning quizzes + 3D action games), journeys repeat a bit harder.
  - Walk, jump, swim, dive, drive a car and row a boat (the car turns into a boat at the shore). Play as Pip, Cloud or Fox.
  - Play styles: Adventure, Calm (low stimulation), Read Along (reading support), Focus (short games and wiggle breaks).
  - Time of day: Auto (real clock), Sunrise, Day, Sunset, Night.
  - Pictures: LahLahLearn mascot art, hand-drawn icons, and the OpenMoji hand-drawn emoji set (CC BY-SA 4.0, openmoji.org), loaded from jsDelivr.
  URL options: ?reset=1 start over · ?demo=1 open everything for a demo · ?magic=0..8 preview graphics levels · ?zone=0..7 start on an island
  Host hooks: window 'lahlah-journey' events + parent.postMessage({source:'lahlah-journey',...});
    window.LahLahJourney.playStop = stop => Promise<stars 1..3>  (use your own learning games), .getState(), .addCoins(n), .addGems(n), .reset()
-->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
@font-face{font-family:'OpenMojiColor';font-display:swap;src:url(https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji@15.0.0/font/OpenMoji-color-glyf_colr_0/OpenMoji-color-glyf_colr_0.woff2) format('woff2');
 unicode-range:U+00A9,U+00AE,U+203C,U+2049,U+2122,U+2139,U+2194-21AA,U+231A-23FF,U+24C2,U+25AA-25FE,U+2600-27BF,U+2934-2935,U+2B05-2B55,U+3030,U+303D,U+3297,U+3299,U+FE0F,U+200D,U+1F000-1FAFF}
:root{--ink:#3b2c22;--ink2:#6b5546;--paper:#fffaf0;--paper2:#fff1d6;--mint:#8fd6a9;--mintd:#3fae74;--sun:#ffd15c;--sund:#e9a92a;--coral:#ff8a76;--sky:#8fd0f0;--lilac:#c9b3ff;
 --mut:#7a6656;--f:'Fredoka','OpenMojiColor',ui-rounded,'SF Pro Rounded','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--hand:'Patrick Hand','Fredoka','Comic Sans MS',cursive;
 --emo:'OpenMojiColor','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;--jh:120px;
 --r1:22px 26px 20px 28px / 26px 20px 28px 22px;--r2:16px 19px 15px 18px / 18px 15px 19px 16px;--r3:13px 15px 12px 16px / 15px 12px 16px 13px;
 --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .23 0 0 0 0 .17 0 0 0 0 .13 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8f0;font-family:var(--f);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px dashed #2b7de9;outline-offset:3px}
.ico{display:inline-block;vertical-align:middle;flex:none;overflow:visible}
.pic{font-family:var(--emo);line-height:1;display:inline-block;vertical-align:middle}
.art{display:inline-block;flex:none}.art svg{width:100%;height:100%;display:block}.art .pp-op{display:none}
.ipic{display:block;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(59,44,34,.25))}
#view{position:fixed;inset:0}#view canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:5}
/* paper + ink: every panel looks like a cut-out card */
.panel,.card,#shop,#panel,#setp,#toast,#bub,.sticky{background:var(--paper) var(--grain);border:3px solid var(--ink);box-shadow:0 5px 0 rgba(59,44,34,.9),0 12px 26px -12px rgba(30,20,10,.45)}
.panel{border-radius:var(--r2)}
.mut{color:var(--mut)}
h2,h3,.hand{font-family:var(--hand);font-weight:400;letter-spacing:.01em}
/* top bar */
#top{left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#top>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#top .tr{justify-content:flex-end}#top .panel,#top button{pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;height:46px;padding:0 14px 0 7px;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.wallet{display:flex;align-items:center;height:52px;padding:0 4px;border-radius:var(--r2)}.wallet .pill{height:46px;padding:0 10px 0 4px}.wallet .pill+.pill{border-left:2px dashed rgba(59,44,34,.22)}
/* the More drawer: the less-used buttons live here so the screen stays clear */
#drawer{position:fixed;z-index:13;right:12px;top:calc(78px + env(safe-area-inset-top,0px));padding:10px;display:grid;grid-template-columns:repeat(3,86px);gap:9px;border-radius:var(--r1);animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.dt{height:86px;border-radius:var(--r2);border:2.5px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.dt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.dt .lb{font-family:var(--hand);font-size:1.05rem;line-height:1}
.dt b{position:absolute;top:-8px;right:-8px;font-size:.7rem;background:var(--mintd);color:#fff;border-radius:10px;padding:1px 6px;border:2px solid var(--ink)}
#bmenu[aria-expanded="true"]{background:#fff0bf var(--grain);transform:translateY(2px)}
.pill.sm{height:36px;font-size:1rem;border:2.5px solid var(--ink);border-radius:var(--r3);background:var(--paper2);box-shadow:0 3px 0 var(--ink)}
.lvl{width:58px;height:58px;border-radius:50%!important;display:grid;place-items:center;position:relative;padding:0;background:conic-gradient(var(--sun) calc(var(--p,0)*1%),#efe4cf 0)!important}
.lvl span{width:42px;height:42px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9}
.lvl small{font-size:.55rem;font-weight:700;color:var(--mut);letter-spacing:.05em}.lvl b{font-size:1.25rem;font-family:var(--hand)}
.ib{min-width:54px;height:56px;padding:3px 6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}
.ib .lb{font-family:var(--hand);font-size:.9rem;line-height:1;margin-top:1px}.ib .ico{width:30px;height:30px}.dt .ico{width:40px;height:40px}
.ib.big{background:#fff0bf var(--grain)}
.ib b{position:absolute;top:-8px;right:-8px;font-size:.7rem;background:var(--mintd);color:#fff;border-radius:10px;padding:1px 6px;border:2px solid var(--ink)}
.has::after{content:"";position:absolute;top:-6px;left:-6px;width:16px;height:16px;border-radius:50%;background:#ff5a6a;border:2.5px solid var(--ink)}
.bump{animation:bump .55s}@keyframes bump{30%{transform:scale(1.18) rotate(-3deg)}}
#goal{left:10px;top:calc(76px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;font-weight:700;cursor:pointer;max-width:290px;pointer-events:auto;transform:rotate(-.8deg)}
#goal .gp{width:42px;height:42px;display:grid;place-items:center}#goal div{flex:1;min-width:0}#goal small{display:block;font-family:var(--hand);font-size:.95rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal i{display:block;height:11px;border-radius:9px;border:2px solid var(--ink);background:#efe4cf;overflow:hidden;margin-top:2px}#goal i em{display:block;height:100%;background:repeating-linear-gradient(-45deg,#ffd15c 0 6px,#ffc23c 6px 12px)}
#goal b{font-size:.85rem;white-space:nowrap;display:flex;align-items:center;gap:2px}
#mini{right:12px;top:calc(82px + env(safe-area-inset-top,0px));width:132px;height:132px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 5px 0 rgba(59,44,34,.9),0 0 0 6px var(--paper);cursor:pointer}
/* journey ticket at the bottom */
#jcard{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 20px));padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;border-radius:var(--r1)}
.jtop{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem;color:var(--ink2)}.jn{white-space:nowrap;display:flex;align-items:center;gap:4px;font-family:var(--hand);font-size:1.05rem}
.segs{flex:1;display:flex;gap:4px}.sg{flex:1;height:20px;border-radius:7px 8px 6px 9px;border:2px solid var(--ink);background:#efe4cf;position:relative;overflow:hidden}
.sg i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(-45deg,#ffd15c 0 5px,#ffc23c 5px 10px);transition:width .7s}.sg em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:.8rem;font-family:var(--emo)}
.sg.cur{outline:3px solid var(--mintd);outline-offset:1px}.sg.full i{background:repeating-linear-gradient(-45deg,#8fd6a9 0 5px,#6cc58c 5px 10px)}
.jmain{display:flex;align-items:center;gap:12px}.jem{flex:none;width:62px;height:62px;border-radius:var(--r2);border:3px solid var(--ink);background:#fff0bf var(--grain);display:grid;place-items:center;font-size:2.3rem;font-family:var(--emo);transform:rotate(-3deg)}
.jtx{flex:1;min-width:0;line-height:1.15}.jtx b{display:block;font-size:1.15rem}.jtx small{color:var(--mut);font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
/* buttons: chunky, outlined, pressable */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:var(--r2);border:3px solid var(--ink);font-weight:700;font-size:1.15rem;background:var(--paper);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--mint)}.btn.sun{background:var(--sun)}.btn.coral{background:var(--coral)}
.btn.sm{min-height:42px;padding:0 13px;font-size:.98rem;border-radius:var(--r3);border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
.pulse{animation:wig 2.4s ease-in-out infinite}@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-2deg) scale(1.03)}92%{transform:rotate(2deg) scale(1.03)}}
/* touch controls */
#joy{left:22px;bottom:calc(var(--jh) + 26px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,250,240,.45);border:3px dashed rgba(59,44,34,.55);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.rbtn{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:none;font-weight:700;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),0 10px 18px -8px rgba(0,0,0,.4)}
.rbtn span{font-family:var(--hand);font-size:.95rem}.rbtn.dn{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#jump{right:22px;bottom:calc(var(--jh) + 34px + env(safe-area-inset-bottom,0px));width:96px;height:96px;background:var(--sun)}
#dive{right:128px;bottom:calc(var(--jh) + 30px + env(safe-area-inset-bottom,0px));width:76px;height:76px;background:var(--sky)}#dive.up{background:var(--mint)}
#dance{right:22px;bottom:calc(var(--jh) + 144px + env(safe-area-inset-bottom,0px));width:60px;height:60px;background:var(--lilac)}
#ride{right:128px;bottom:calc(var(--jh) + 116px + env(safe-area-inset-bottom,0px));width:74px;height:74px;background:#ffc9a8}#ride.on{background:var(--paper)}
#drift{right:22px;bottom:calc(var(--jh) + 34px + env(safe-area-inset-bottom,0px));width:98px;height:98px;background:#c9b3ff}#drift.dn{background:#b39cf5}
.rbtn .key{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font:700 .64rem/1 var(--f);background:var(--ink);color:#fff;border-radius:6px;padding:3px 6px;white-space:nowrap;letter-spacing:.03em}
.rbtn{position:fixed}.touch .key{display:none}
#speedo{right:120px;bottom:calc(var(--jh) + 26px + env(safe-area-inset-bottom,0px));width:100px;height:64px;padding:6px 6px 0;border-radius:52px 52px 16px 16px;background:var(--paper) var(--grain);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);overflow:hidden}
#speedo svg{width:100%;height:100%;display:block}#speedo.boost{background-color:#fff0bf}
#speedo i{position:absolute;left:50%;bottom:6px;width:5px;height:34px;margin-left:-2.5px;background:var(--ink);border-radius:3px;transform-origin:50% 100%;transform:rotate(-90deg);transition:transform .15s}
#speedo::after{content:"";position:absolute;left:50%;bottom:2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--coral);border:2.5px solid var(--ink)}
#breath{left:50%;top:calc(140px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:6px;padding:8px 12px;border-radius:20px;background:rgba(255,250,240,.85);border:3px solid var(--ink)}
#breath i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:#e7f4fb}#breath i.on{background:radial-gradient(circle at 35% 35%,#fff,#9fe4ff)}
#hint{left:12px;bottom:12px;font-family:var(--hand);font-size:1rem;color:#fff;text-shadow:0 2px 0 rgba(59,44,34,.7);pointer-events:none;max-width:260px}
/* challenge scoreboard */
#chud{left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%) rotate(-.6deg);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;font-weight:700;font-size:1.3rem;white-space:nowrap;border-radius:var(--r2)}
#chud .e{font-size:1.7rem;font-family:var(--emo);display:flex}#chud .tm{color:var(--mut);font-size:1rem;display:flex;align-items:center;gap:3px}
/* speech bubble, floating score, banner, toast */
#bub{position:fixed;z-index:4;transform:translate(-50%,-100%);border-radius:var(--r2);padding:8px 14px;font-weight:600;font-size:1.05rem;pointer-events:none;max-width:280px;text-align:center;box-shadow:0 4px 0 rgba(59,44,34,.9)}
#bub::after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-9px;width:18px;height:18px;background:var(--paper);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(6deg,6deg)}
.fl{position:fixed;z-index:6;pointer-events:none;font-weight:700;font-family:var(--hand);font-size:1.6rem;color:#fff;-webkit-text-stroke:1.2px var(--ink);text-shadow:0 2px 0 var(--ink);transform:translate(-50%,-50%);animation:flup 1s ease-out forwards;display:flex;align-items:center;gap:2px}
@keyframes flup{to{transform:translate(-50%,-160%);opacity:0}}
#banner{position:fixed;z-index:15;left:50%;top:26%;transform:translate(-50%,-50%) scale(.7) rotate(-2deg);opacity:0;pointer-events:none;text-align:center;font-family:var(--hand);font-size:clamp(2.4rem,7.5vw,4rem);color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);transition:transform .35s cubic-bezier(.2,1.5,.4,1),opacity .3s;white-space:nowrap}
#banner small{display:block;font-size:.45em;-webkit-text-stroke:1px var(--ink);text-shadow:0 2px 0 var(--ink)}#banner.on{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}
#toast{position:fixed;z-index:16;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px) rotate(-1deg);opacity:0;background:#fff3a8 var(--grain);padding:12px 18px;border-radius:6px 8px 5px 9px;font-weight:600;max-width:min(92vw,440px);text-align:center;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0) rotate(-1deg)}
#stk{position:fixed;z-index:17;right:14px;bottom:calc(var(--jh) + 30px);display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:var(--r2);transform:translateX(130%) rotate(6deg);transition:transform .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#stk.on{transform:rotate(-2deg)}#stk span{width:58px;height:58px;display:grid;place-items:center;font-size:2.4rem;font-family:var(--emo);filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 2px rgba(0,0,0,.3))}
#stk small{display:block;color:var(--coral);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}#stk b{font-family:var(--hand);font-size:1.2rem;font-weight:400}
#flash{position:fixed;inset:0;z-index:25;background:#fffaf0;opacity:0;pointer-events:none}#flash.on{animation:flash .7s ease-out}@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#flash.soft.on{animation:flashS 1.1s ease-in-out}@keyframes flashS{0%{opacity:0}45%{opacity:.6}100%{opacity:0}}
#uw{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at 50% 0%,rgba(140,230,255,.25),rgba(0,60,110,.35));mix-blend-mode:multiply}
#uw.on{opacity:1}#uw::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.07) 0 18px,transparent 18px 46px);animation:caus 6s linear infinite;mix-blend-mode:screen}@keyframes caus{to{background-position:120px 60px}}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 62%,rgba(30,20,10,.14) 100%)}
/* dialogs */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:14px;background:rgba(40,30,20,.32)}
[hidden]{display:none!important}
.card{border-radius:var(--r1);padding:18px 18px 20px;width:min(560px,100%);max-height:calc(100dvh - 28px);overflow:auto;position:relative;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
.card h2{margin:2px 0 6px;font-size:2.1rem;line-height:1.05;display:flex;align-items:center;justify-content:center;gap:8px}
.card p{margin:6px 0;font-size:1.1rem}.card .big{font-size:1.5rem;font-family:var(--hand);font-weight:400}
.x{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;background:var(--paper2);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;z-index:2}
.x:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.rowc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tape{position:absolute;top:0;left:50%;width:110px;height:22px;margin-left:-55px;pointer-events:none;background:rgba(255,226,140,.75);border:1.5px solid rgba(59,44,34,.25);transform:rotate(-3deg)}
/* quiz */
.quiz{border-top:12px solid var(--zc,var(--mintd))}
.qh{display:flex;align-items:center;gap:10px;padding-right:52px;text-align:left}.qh .em{font-size:2.2rem;width:56px;height:56px;border-radius:var(--r2);border:3px solid var(--ink);background:#fff0bf;display:grid;place-items:center;font-family:var(--emo);transform:rotate(-3deg)}
.qh b{font-size:1.3rem;display:block;font-family:var(--hand);font-weight:400}.qh small{color:var(--mut);font-weight:600;display:flex;align-items:center;gap:3px}
.qd{display:flex;gap:6px;margin-left:auto}.qd i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:#efe4cf}.qd i.on{background:var(--sun)}
.qp{font-size:1.55rem;font-weight:700;margin:14px 0 6px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.qp .lt{font-size:2.4rem;color:#e05a7a;font-family:var(--hand)}.bigemo{font-size:2.9rem;line-height:1;font-family:var(--emo)}
.hear{width:50px;height:50px;border-radius:50%;background:var(--sky);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;flex:none}

}

.reel h2{margin:4px 0 0;font-size:clamp(22px,4vw,30px)}
.reel .isl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.reel .it{position:relative;background:var(--sand,#fff6dc);border:3px solid var(--ink);border-radius:20px;padding:8px 4px 6px;text-align:center;opacity:0;transform:translateY(24px) scale(.8)}
.reel .sc.on .it{animation:rIn .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--i)*.12s)}
.reel .it b{display:block;font-size:34px;line-height:1.1}.reel .it small{display:flex;justify-content:center;flex-wrap:wrap;gap:1px;font-size:15px;line-height:1.2;margin-top:3px}

.reel .it:last-child{background:#fff3c4}
@keyframes rIn{to{opacity:1;transform:none}}
.reel .games{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.reel .g1{font-size:40px;line-height:1;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 0;text-align:center;opacity:0;transform:scale(.4) rotate(-12deg)}
.reel .sc.on .g1{animation:rPop .45s cubic-bezier(.3,1.7,.5,1) forwards;animation-delay:calc(var(--i)*.07s)}
@keyframes rPop{to{opacity:1;transform:none}}
.reel .road{position:relative;width:100%;height:120px}
.reel .road svg{position:absolute;inset:0;width:100%;height:100%}
.reel .road .car{position:absolute;left:0;top:0;font-size:38px;offset-path:path('M20 90 C 120 10, 220 110, 320 50 S 520 20, 600 70');offset-rotate:0deg}
.reel .sc.on .road .car{animation:rDrive 3.4s ease-in-out forwards}

.reel .trophy{position:relative;font-size:130px;line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12))}
.reel .sc.on .trophy{animation:rTro 1.4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes rTro{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:none}}
.reel .rays{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-230px 0 0 -210px;background:repeating-conic-gradient(rgba(255,210,63,.45) 0 10deg,transparent 10deg 20deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:rSpin 12s linear infinite;z-index:-1}
@keyframes rSpin{to{transform:rotate(360deg)}}
.reel .gifts{display:flex;gap:14px;font-size:46px;margin-top:2px}.reel .gifts span{display:inline-block;animation:rHop 1s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}

.reel .cf{position:absolute;top:-10px;width:10px;height:16px;border-radius:3px;opacity:0}
.reel .sc.on .cf{animation:rFall 2.6s linear infinite;animation-delay:calc(var(--i)*.13s)}

@media (prefers-reduced-motion:reduce){.reel *{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* animated how-to clips: a tiny looping cartoon that shows what to do */
.demo{position:relative;height:170px;border:3px solid var(--ink);border-radius:20px;overflow:hidden;margin:8px 0 6px;background:var(--dbg)}

.demo .it{font-size:38px;bottom:var(--y)}.demo .wk{font-size:46px;bottom:24px;z-index:2}.demo .fx{font-size:28px;opacity:0}

.demo .pad b{position:absolute;left:12px;top:12px;width:18px;height:18px;border-radius:50%;background:var(--ink);animation:dPad 5s ease-in-out infinite}
@keyframes dPad{0%,8%{transform:none}15%,85%{transform:translateX(9px)}92%,100%{transform:none}}
.intro .demo + .rl2{margin-top:2px}
@media (prefers-reduced-motion:reduce){.demo *{animation-play-state:paused!important}}

  function leaf(par,c1,c2,L,W,x,y,z,rz,rx=0){const g=leafGeo(L,W);g.computeBoundingBox();const m=vm(g,(px,py)=>mix(c1,c2,sstep(0,L,py)),par,x,y,z);m.rotation.set(rx,0,rz);return m}
  function star(par,col,R,x,y,z){const s=new T.Shape();for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,r=i%2?R*.52:R;i?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r)}

    const tail=vm(tg,(x,y,z)=>mix(OR,CR,sstep(.58,.74,y+.07*Math.sin(Math.atan2(z,x)*4))).lerp(C(ORD),sstep(-.2,-.9,y)*.25),tailP,.5,.55,-.08);tail.rotation.z=-.55;
    /* head */

    const hg=deform(sph(1,36,26),v=>{const w=sstep(.4,.92,Math.abs(v.x))*sstep(.3,-.55,v.y);v.x*=1+.16*w;if(v.y<-.4)v.y=-.4-(-.4-v.y)*.8});

      return base.lerp(C(CR),cm)},head,0,0,0,1.12,.9,1);
    /* ears */
    [-1,1].forEach(s=>{
      const piv=new T.Group();piv.position.set(s*.68,.62,-.06);head.add(piv);ears.push(piv);
      const e=new T.Group();e.rotation.z=-s*.32;e.rotation.x=-.1;piv.add(e);
      vm(lathe(.5,1.12,3.0),(x,y)=>mix(OR,BR,sstep(.42,.72,y/1.12)),e,0,0,0,1,1,.5);
      vm(lathe(.34,.82,3.0),(x,y)=>mix('#fff4ec','#ffe6d6',sstep(.0,.8,y)),e,0,.02,.2,1,1,.4);
    });
    /* cheek fur tufts */
    [-1,1].forEach(s=>{[[-.08,.14,.34,.5],[-.3,.06,.3,.8]].forEach(([y,z,L,rz])=>{
      const t=vm(lathe(.17,L,1.8,14),(x,py)=>mix(OR2,CR,.4*sstep(.45,.95,py/L)),head,s*1.0,y,z,1,1,.8);t.rotation.z=-s*(Math.PI/2+rz*.5);t.rotation.y=s*.25})});
    [[0,1.0,.2],[.15,.95,.17],[-.15,.95,.17]].forEach(([x,y,r])=>pm(sph(r,14,10),OR2,head,x,y,.2,1,.9,.9));
    /* painted face */

        let gr=g.createRadialGradient(0,34,6,0,0,116);gr.addColorStop(0,'#b46a34');gr.addColorStop(.45,'#6e3a1e');gr.addColorStop(1,'#2a140c');
        g.fillStyle=gr;g.beginPath();g.ellipse(0,0,86,108,0,0,7);g.fill();
        g.fillStyle='#120804';g.beginPath();g.ellipse(0,-8,58,72,0,0,7);g.fill();
        g.fillStyle='rgba(255,210,170,.35)';g.beginPath();g.ellipse(0,66,44,14,0,0,7);g.fill();
        g.fillStyle='#fff';g.beginPath();g.arc(26,-44,26,0,7);g.fill();g.beginPath();g.arc(-25,32,12,0,7);g.fill();
        g.restore()};

      [.25,.75].forEach((u,i)=>{g.beginPath();g.arc(W*u+(i?-4:4),H*.17,40,Math.PI*1.18,Math.PI*1.82);g.stroke()});
      [.12,.88].forEach(u=>{const gr=g.createRadialGradient(W*u,H*.7,4,W*u,H*.7,70);gr.addColorStop(0,'rgba(255,128,142,.8)');gr.addColorStop(1,'rgba(255,128,142,0)');g.fillStyle=gr;g.beginPath();g.ellipse(W*u,H*.7,70,46,0,0,7);g.fill()});
      g.fillStyle='#2a1510';g.beginPath();g.ellipse(W/2,H*.585,27,18,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(W/2-8,H*.57,8,4,0,0,7);g.fill();
      g.strokeStyle='#2a1510';g.lineWidth=6;g.beginPath();g.moveTo(W/2,H*.6);g.lineTo(W/2,H*.64);g.stroke();
      g.fillStyle='#7c1d2c';g.beginPath();g.moveTo(W/2-62,H*.64);g.quadraticCurveTo(W/2,H*.7,W/2+62,H*.64);g.quadraticCurveTo(W/2+46,H*.84,W/2,H*.85);g.quadraticCurveTo(W/2-46,H*.84,W/2-62,H*.64);g.fill();
      g.fillStyle='#ff8296';g.beginPath();g.ellipse(W/2,H*.8,30,16,0,0,7);g.fill();

      g.fillStyle='#fff';g.save();g.translate(W/2,H*.36);g.rotate(.5);g.beginPath();g.moveTo(0,-62);g.bezierCurveTo(56,-26,40,40,0,66);g.bezierCurveTo(-40,40,-56,-26,0,-62);g.fill();g.strokeStyle='#58b06d';g.lineWidth=7;g.beginPath();g.moveTo(0,-40);g.lineTo(0,56);g.stroke();g.restore()});
    const bs=new T.Shape();bs.moveTo(-.56,0);bs.lineTo(.56,0);bs.quadraticCurveTo(.3,-.42,0,-.7);bs.quadraticCurveTo(-.3,-.42,-.56,0);
    const bg=new T.ShapeGeometry(bs,10);{const p=bg.attributes.position,uv=bg.attributes.uv;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);p.setZ(i,.12-x*x*.5+y*.05);uv.setXY(i,(x+.56)/1.12,(y+.7)/.7)}bg.computeVertexNormals()}

    const ring=pm(new T.TorusGeometry(.5,.085,8,28),GR,I,0,1.17,.03,1,.95,.85);ring.rotation.x=Math.PI/2;
    [-1,1].forEach(s=>{const k=pm(sph(.13,12,10),GR,I,s*.22,1.15,-.45,1.3,1,1);k.rotation.z=s*.5});pm(sph(.1,12,10),GR,I,0,1.15,-.5);
    body.userData.tail=tailP;
    fx=(t,mv,calm)=>{if(calm){return}tailP.rotation.y=Math.sin(t*(mv?9:2.2))*(mv?.28:.14);head.rotation.z=Math.sin(t*1.4)*.025;head.rotation.x=mv?Math.sin(t*9)*.03:Math.sin(t*1.1)*.012};

  /* ===================== CLOUD BUNNY ===================== */
  if(kind==='cloud'){

    /* cloud seat: white on top, mint-blue underneath */
    [[0,.34,0,.82,.55],[-.7,.3,.06,.52,.46],[.7,.3,.06,.52,.46],[-.36,.22,.56,.48,.4],[.4,.22,.56,.46,.4],[0,.2,-.56,.5,.42],[-1.0,.24,-.22,.36,.32],[1.0,.22,-.22,.34,.3]]

      mk(.5,1.0,WH,MINT,-.01,.3);
      mk(.4,.84,'#ffffff','#e7f6e3',.075,.26);
    });
    /* painted face: happy closed eyes, open smile, blush */

    /* crescent moon + sprout */
    const cs=new T.Shape();cs.absarc(0,0,.19,Math.PI*.15,Math.PI*1.85,false);cs.absarc(.08,0,.16,Math.PI*1.85,Math.PI*.15,true);

      head.rotation.z=Math.sin(t*1.3)*.02;arm.rotation.z=Math.sin(t*2.6)*.16;
      stars.forEach((s,i)=>{s.rotation.y=t*1.4+i;s.position.y=s.userData.y0+Math.sin(t*1.6+i*2)*.06})};

  }
  return {root,body,ears,fx,walk};
}
